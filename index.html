<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>SHAKTI-IND</title>
  <style>
    :root {
      --saffron: #FF7A33;
      --green:   #0F9D58;
      --bg:      #ffffff;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    .bg-gradient {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg,
    #fff3e6 0%,    /* very light saffron */
    #f8fff8 45%,   /* soft cream */
    #e6f7f0 100%   /* very light green */
  );
  z-index: -1;
}
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #opening {
      text-align: center;
      width: 100%;
      max-width: 500px;
      padding: 0 20px;
      animation: fadeUp 1.1s ease-out;
    }

    .logo {
      font-size: clamp(2.8rem, 9vw, 5.2rem);
  letter-spacing: clamp(0.08rem, 0.4vw, 0.18rem);
      font-weight: 900;
      /* letter-spacing: 0.18rem; */
      background: linear-gradient(90deg, var(--saffron) 50%, var(--green) 50%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      user-select: none;
      margin-bottom: 1rem;
      white-space: nowrap;
      line-height: 1;
      padding: 0 12px;
      display: inline-block;
      position: relative;
      display: block;
  margin-inline: auto;
  text-align: center;
    }

    .slogan {
      font-size: clamp(0.8rem, 4vw, 1.15rem);
  margin-bottom: 2.8rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: #555;
      text-transform: lowercase;
      font-variant: small-caps;
      /* margin-bottom: 3.5rem; */
      opacity: 0.92;
    }

    .btn-start {
      padding: 16px 64px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(15,157,88,0.38);
      transition: all 0.4s ease;
    }

    .btn-start:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 45px rgba(15,157,88,0.55);
    }

    /* Main Screen */
    #main {
      position: fixed;
      inset: 0;
      background: var(--bg);
      transform: translateY(100%);
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.4,0,0.2,1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #main.active {
      transform: translateY(0);
      opacity: 1;
    }

    .header-logo {
      position: fixed;
      top: 24px;
      left: 24px;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--saffron) 50%, var(--green) 50%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateX(-80px) scale(0.7);
      transition: all 0.9s ease-out 0.2s;
      z-index: 10;
    }

    .header-logo.visible {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    .languages {
      padding: 110px 20px 20px;
      max-width: 600px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 16px;
    }

    .lang-card {
      background: white;
      padding: 20px 12px;
      border-radius: 18px;
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.35s ease;
      border: 2px solid transparent;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      position: relative;
    }

    .lang-card.selected {
      background: #ffffff;
      border-color: var(--green);
      transform: translateY(-6px) scale(1.05);
      box-shadow: 0 12px 30px rgba(15,157,88,0.3);
    }

    .btn-continue {
      margin: 30px auto;
      padding: 16px 70px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255,122,51,0.4);
      transition: all 0.4s ease;
    }

    .btn-continue:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 45px rgba(15,157,88,0.55);
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(40px); }
      to { opacity:1; transform:translateY(0); }
    }

    /* MOBILE FIXES ONLY */
    @media (max-width: 520px) {
      .btn-continue {
        position: sticky;
        bottom: 16px;
        z-index: 20;
      }

      .logo {
        font-size: 3.5rem;
        letter-spacing: 0.32rem;
      }

      .slogan {
        font-size: 1.3rem;
      }

      .languages {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        padding-top: 130px;
      }

      .lang-card {
        font-size: 1rem;
        padding: 16px 8px;
      }
    }/* LOADING BAR */
#loader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: rgba(0,0,0,0.05);
  z-index: 9999;
  overflow: hidden;
  display: none;
}

.loader-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(
    90deg,
    var(--saffron),
    var(--green)
  );
  transition: width 1.2s ease;
}

  </style>
</head>

<body>
  <div class="bg-gradient"></div>
 <!-- Loading Bar -->
<div id="loader">
  <div class="loader-bar"></div>
</div>

  <div id="opening">
    <h1 class="logo">shaktiind</h1>
    <p class="slogan">one platform, one nation.</p>
    <button class="btn-start" onclick="startApp()">Get Started</button>
  </div>

  <div id="main">
    <div class="bg-gradient"></div>
    <div class="header-logo" id="headerLogo">shaktiind</div>

    <div class="languages">
      <div class="lang-card" onclick="select(this)">English</div>
      <div class="lang-card" onclick="select(this)">हिन्दी</div>
      <div class="lang-card" onclick="select(this)">বাংলা</div>
      <div class="lang-card" onclick="select(this)">తెలుగు</div>
      <div class="lang-card" onclick="select(this)">मराठी</div>
      <div class="lang-card" onclick="select(this)">தமிழ்</div>
      <div class="lang-card" onclick="select(this)">ગુજરાતી</div>
      <div class="lang-card" onclick="select(this)">ಕನ್ನಡ</div>
      <div class="lang-card" onclick="select(this)">മലയാളം</div>
      <div class="lang-card" onclick="select(this)">ਪੰਜਾਬੀ</div>

    </div>

    <button class="btn-continue" onclick="window.location.href='login_page.html'">
      Continue
    </button>
  </div>

<script>
  function startApp() {
    const loader = document.getElementById('loader');
    const bar = document.querySelector('.loader-bar');

    loader.style.display = 'block';

    // Start loading animation
    setTimeout(() => bar.style.width = '100%', 50);

    // After loading finishes
    setTimeout(() => {
      loader.style.display = 'none';
      document.getElementById('opening').style.opacity = '0';

      setTimeout(() => {
        document.getElementById('opening').style.display = 'none';
        document.getElementById('main').classList.add('active');
        setTimeout(() =>
          document.getElementById('headerLogo').classList.add('visible'), 300
        );
      }, 400);

    }, 1200);
  }

  function select(el) {
    document.querySelectorAll('.lang-card').forEach(c =>
      c.classList.remove('selected')
    );
    el.classList.add('selected');
  }
</script>


</body>
</html>
