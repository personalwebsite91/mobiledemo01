<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Camera</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  font-family:Poppins,system-ui;
  height:100vh;
  overflow:hidden;
  color:#fff;
}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

.camera{position:relative;width:100%;height:100%}
video,canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
video.mirror{transform:scaleX(-1)}

.top{
  position:absolute;
  top:12px;
  width:100%;
  text-align:center;
  font-weight:600;
  z-index:20;
}

/* FILTER SCROLLER */
.filters{
  position:absolute;
  bottom:90px;
  width:100%;
  display:flex;
  gap:26px;
  padding:0 50%;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  z-index:20;
}
.filter{
  scroll-snap-align:center;
  text-align:center;
  opacity:.4;
  transition:.3s;
}
.filter.active{
  opacity:1;
  transform:scale(1.2);
}

/* STAR */
.star{
  width:42px;
  height:42px;
  clip-path:polygon(
    50% 0%,61% 35%,98% 35%,68% 57%,
    79% 100%,50% 75%,21% 100%,32% 57%,
    2% 35%,39% 35%
  );
  transition: transform .35s ease;
  background:conic-gradient(#FF9933,#138808,#FF9933);
}
.filter.active .star{
  transform: rotate(180deg) scale(1.15);
}
@keyframes blink{50%{opacity:.3}}
#recordTimer{color:red;animation:blink 1s infinite}


/* CONTROLS */
.controls{
  position:absolute;
  bottom:150px;
  width:100%;
  padding:10px 16px;
  display:none;
  z-index:20;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
  border-radius:14px;
}
.controls.show{display:block}
.controls label{font-size:12px;opacity:.85}
.controls{
  transition: opacity .25s ease, transform .25s ease;
  transform: translateY(10px);
  opacity:0;
}
.controls.show{
  opacity:1;
  transform: translateY(0);
}


/* CAPTURE */
.capture{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:72px;
  height:72px;
  border-radius:50%;
  border:5px solid #fff;
  background:none;
  z-index:20;
}

/* FLIP CAMERA BUTTON */
.flip-btn{
  position:absolute;
  bottom:28px;
  right:24px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  cursor:pointer;
}

/* SAVE / CLOSE */
.action-btn{
  position:absolute;
  top:12px;
  padding:6px 14px;
  border-radius:20px;
  background:rgba(0,0,0,.6);
  font-size:13px;
  z-index:50;
  display:none;
}
#saveBtn{left:12px}
#closeBtn{left:12px;top:45px}
</style>
</head>

<body>

<div class="camera" id="camera">
  <div class="top">Shakticlick</div>
  <div id="recordTimer"
     style="position:absolute;top:45px;width:100%;
            text-align:center;font-weight:600;
            z-index:25;display:none;">
  ● 00:00
</div>


  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- BLUR CONTROLS (TINT REMOVED) -->
  <div class="controls" id="blurControls">
    <label>Blur Intensity</label>
    <input type="range" min="0" max="8" value="3" id="blurIntensity">
  </div>
<video id="previewVideo"
       controls
       style="position:absolute;inset:0;
              width:100%;height:100%;
              object-fit:cover;
              z-index:40;
              display:none;
              background:#000">
</video>


  <!-- FILTERS -->
  <div class="filters" id="filters"></div>

  <button class="capture"></button>
  <div class="flip-btn" id="flipBtn">↺</div>
<div id="effectsBtn"
     style="
       position:absolute;
       bottom:110px;
       right:20px;
       font-size:22px;
       background:rgba(0,0,0,0.6);
       border-radius:50%;
       width:46px;
       height:46px;
       display:none;
       align-items:center;
       justify-content:center;
       z-index:60;
       cursor:pointer;">
✨
</div>

  <div class="action-btn" id="saveBtn">Save</div>
  <div class="action-btn" id="closeBtn">✕</div>
</div>

<script>
    let recordedVideoURL = null;

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const controls=document.getElementById("blurControls");
const filtersDiv=document.getElementById("filters");
const saveBtn=document.getElementById("saveBtn");
const closeBtn=document.getElementById("closeBtn");
const blurIntensityInput=document.getElementById("blurIntensity");
const flipBtn=document.getElementById("flipBtn");

let filter="normal";
let blurIntensity=3;
let frozen=false;
let facingMode="user";
let stream=null;
let blurHideTimer=null;
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let pressTimer = null;
let recordStartTime = 0;
let recordTimerInterval = null;


if(filter==="normal"){
  ctx.filter="contrast(1.06) saturate(1.08) brightness(1.02)";
  drawVideo();
  ctx.filter="none";
}

/* CAMERA */
async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode}});
  video.srcObject = stream;
  video.classList.toggle("mirror", facingMode==="user");
}
startCamera();
function startRecording(){
  if(!stream) return;

  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm" });

  mediaRecorder.ondataavailable = e => {
    if(e.data.size > 0) recordedChunks.push(e.data);
  };

mediaRecorder.onstop = () => {
  const blob = new Blob(recordedChunks, { type: "video/webm" });
  recordedVideoURL = URL.createObjectURL(blob);

  // show preview
  const preview = document.getElementById("previewVideo");
  preview.src = recordedVideoURL;
  preview.style.display = "block";
  preview.play();

  frozen = true;
  filtersDiv.style.display = "none";
  saveBtn.style.display = "block";
  closeBtn.style.display = "block";
};



  mediaRecorder.start();
  isRecording = true;
  recordStartTime = Date.now();
document.getElementById("recordTimer").style.display = "block";
updateRecordTimer();
recordTimerInterval = setInterval(updateRecordTimer, 1000);

}
function stopRecording(){
  if(mediaRecorder && isRecording){
    mediaRecorder.stop();
    isRecording = false;
    clearInterval(recordTimerInterval);
document.getElementById("recordTimer").style.display = "none";

  }
}
function updateRecordTimer(){
  const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
  const min = String(Math.floor(elapsed / 60)).padStart(2,"0");
  const sec = String(elapsed % 60).padStart(2,"0");
  document.getElementById("recordTimer").textContent = `● ${min}:${sec}`;
}

const captureBtn = document.querySelector(".capture");

captureBtn.addEventListener("mousedown",()=>{
  pressTimer = setTimeout(()=>{
    startRecording();
  },400);   // long press = 400ms
});

captureBtn.addEventListener("mouseup",()=>{
  clearTimeout(pressTimer);
  if(isRecording){
    stopRecording();
  }
});

captureBtn.addEventListener("mouseleave",()=>{
  clearTimeout(pressTimer);
  if(isRecording){
    stopRecording();
  }
});

captureBtn.addEventListener("touchstart",()=>{
  pressTimer = setTimeout(()=>{
    startRecording();
  },400);
});

captureBtn.addEventListener("touchend",()=>{
  clearTimeout(pressTimer);
  if(isRecording){
    stopRecording();
  }
});

video.onloadedmetadata=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  draw();
};

/* FILTER LIST (EXTRA FILTERS ADDED) */
[
  "normal",
  "blur",
  "bright",
  "daylight",
  "indoor",
  "portrait",
  "hdr",

  "kodak",
  "fuji",
  "film",
  "matte",

  "cinematic",
  "fashion",
  "doc",
  "moody",
  "noir",

  "night",
  "city",

  "warm",
  "cool",
  "soft",
  "fade",
  "glow"
].forEach(f=>{
  const d=document.createElement("div");
  d.className="filter";
  d.dataset.f=f;
  d.innerHTML=`<div class="star"></div><div style="font-size:11px">${f}</div>`;
  filtersDiv.appendChild(d);
});

/* SCROLL DETECT */
filtersDiv.addEventListener("scroll",()=>{
  document.querySelectorAll(".filter").forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.left<innerWidth/2 && r.right>innerWidth/2){
      document.querySelectorAll(".filter").forEach(e=>e.classList.remove("active"));
      el.classList.add("active");
      filter=el.dataset.f;
      if(filter==="blur"){
  showBlurControls();
}else{
  controls.classList.remove("show");
}
    }
  });
});
function showBlurControls(){
  controls.classList.add("show");
  clearTimeout(blurHideTimer);
  blurHideTimer = setTimeout(()=>{
    controls.classList.remove("show");
  },3000);
}
/* FLIP CAMERA */
flipBtn.onclick=()=>{
  facingMode = facingMode==="user" ? "environment" : "user";
  startCamera();
};

/* DRAW */
function drawVideo(){
  ctx.save();
  if(facingMode==="user"){
    ctx.translate(canvas.width,0);
    ctx.scale(-1,1);
  }
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();
}
function gradeImage({
  exposure = 1,
  contrast = 1,
  saturation = 1,
  shadows = 0,
  highlights = 0,
  tint = null,
  blur = 0
}){
  // Base color grading
  ctx.filter = `
    brightness(${exposure})
    contrast(${contrast})
    saturate(${saturation})
    blur(${blur}px)
  `;
  drawVideo();
  ctx.filter = "none";

  // Shadow lift / crush
  if(shadows !== 0){
    ctx.globalCompositeOperation = "overlay";
    ctx.fillStyle = shadows > 0
      ? `rgba(0,0,0,${shadows})`
      : `rgba(255,255,255,${-shadows})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation = "source-over";
  }

  // Highlight rolloff
  if(highlights !== 0){
    ctx.globalCompositeOperation = "screen";
    ctx.fillStyle = `rgba(255,255,255,${highlights})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation = "source-over";
  }

  // Color tint (split toning lite)
  if(tint){
    ctx.globalCompositeOperation = "color";
    ctx.fillStyle = tint;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation = "source-over";
  }
}


function applyFilter(name){
  switch(name){

    /* ===== CAMERA / EVERYDAY ===== */

    case "normal":
      gradeImage({
        exposure: 1.02,
        contrast: 1.05,
        saturation: 1.04,
        shadows: -0.04,
        highlights: 0.03
      });
      break;

    case "bright":
      gradeImage({
        exposure: 1.12,
        contrast: 1.06,
        saturation: 1.05,
        shadows: -0.06,
        highlights: 0.05
      });
      break;

    case "daylight":
      gradeImage({
        exposure: 1.08,
        contrast: 1.04,
        saturation: 1.12,
        shadows: -0.05,
        highlights: 0.06,
        tint: "rgba(255,240,210,0.07)"
      });
      break;

    case "indoor":
      gradeImage({
        exposure: 1.05,
        contrast: 1.04,
        saturation: 1.1,
        shadows: -0.06,
        highlights: 0.04,
        tint: "rgba(255,215,180,0.12)"
      });
      break;

    /* ===== PORTRAIT (SKIN SAFE) ===== */

    case "portrait":
      gradeImage({
        exposure: 1.04,
        contrast: 0.96,
        saturation: 1.06,
        shadows: -0.08,
        highlights: 0.05,
        tint: "rgba(255,220,200,0.09)"
      });
      break;

    /* ===== COLOR BALANCE ===== */

    case "warm":
      gradeImage({
        exposure: 1.03,
        contrast: 1.04,
        saturation: 1.12,
        shadows: -0.06,
        highlights: 0.05,
        tint: "rgba(255,195,150,0.14)"
      });
      break;

    case "cool": // TRUE cool grading
      gradeImage({
        exposure: 1.01,
        contrast: 1.08,
        saturation: 1.04,
        shadows: -0.06,
        highlights: 0.04,
        tint: "rgba(170,210,255,0.14)"
      });
      break;

    /* ===== FILM / ANALOG ===== */

    case "film":
      gradeImage({
        exposure: 1.03,
        contrast: 0.88,
        saturation: 0.94,
        shadows: -0.18,
        highlights: 0.1,
        tint: "rgba(200,160,120,0.16)"
      });
      break;

    case "kodak":
      gradeImage({
        exposure: 1.05,
        contrast: 1.14,
        saturation: 1.18,
        shadows: -0.08,
        highlights: 0.06,
        tint: "rgba(215,160,90,0.14)"
      });
      break;

    case "fuji":
      gradeImage({
        exposure: 1.02,
        contrast: 1.1,
        saturation: 1.08,
        shadows: -0.04,
        highlights: 0.04,
        tint: "rgba(200,225,255,0.08)"
      });
      break;

    case "matte":
      gradeImage({
        exposure: 1.06,
        contrast: 0.86,
        saturation: 0.94,
        shadows: -0.22,
        highlights: 0.06
      });
      break;

    /* ===== CINEMATIC / EDITORIAL ===== */

    case "cinematic":
      gradeImage({
        exposure: 0.96,
        contrast: 1.35,
        saturation: 1.06,
        shadows: 0.18,
        highlights: 0.06,
        tint: "rgba(20,50,80,0.18)"
      });
      break;

    case "fashion":
      gradeImage({
        exposure: 1.01,
        contrast: 1.32,
        saturation: 1.05,
        shadows: 0.08,
        highlights: 0.05
      });
      break;

    case "doc":
      gradeImage({
        exposure: 1,
        contrast: 1.15,
        saturation: 0.9,
        shadows: 0,
        highlights: 0
      });
      break;

    case "moody":
      gradeImage({
        exposure: 0.9,
        contrast: 1.38,
        saturation: 1.08,
        shadows: 0.2,
        highlights: 0.03,
        tint: "rgba(25,40,60,0.15)"
      });
      break;

    case "noir":
      gradeImage({
        exposure: 0.88,
        contrast: 1.55,
        saturation: 0,
        shadows: 0.22,
        highlights: 0.04
      });
      break;

    /* ===== NIGHT ===== */

    case "night":
      gradeImage({
        exposure: 1.18,
        contrast: 1.2,
        saturation: 1.1,
        shadows: -0.14,
        highlights: 0.03,
        tint: "rgba(40,70,140,0.18)"
      });
      break;

    case "city":
      gradeImage({
        exposure: 1.1,
        contrast: 1.32,
        saturation: 1.28,
        shadows: 0.06,
        highlights: 0.05
      });
      break;

    /* ===== SPECIAL ===== */

    case "blur":
      gradeImage({ blur: blurIntensity });
      break;

    case "glow":
      gradeImage({
        exposure: 1.06,
        contrast: 1.04,
        saturation: 1.1,
        highlights: 0.1,
        blur: 1.2
      });
      break;

    case "fade":
      gradeImage({
        exposure: 1.05,
        contrast: 0.85,
        saturation: 0.9,
        shadows: -0.22,
        highlights: 0.06
      });
      break;

    case "hdr":
      gradeImage({
        exposure: 1.1,
        contrast: 1.2,
        saturation: 1.1,
        shadows: -0.14,
        highlights: 0.08
      });
      break;

    case "soft":
      gradeImage({
        exposure: 1.03,
        contrast: 0.94,
        saturation: 1.04,
        shadows: -0.06,
        highlights: 0.05,
        blur: 0.6
      });
      break;

    default:
      ctx.filter = "none";
  }
}

function draw(){
  if(!frozen){
    drawVideo();
    applyFilter(filter);
  }
  requestAnimationFrame(draw);
}



blurIntensityInput.oninput=e=>{
  blurIntensity=Number(e.target.value);
};
document.getElementById("camera").addEventListener("click",()=>{
  if(filter==="blur"){
    if(controls.classList.contains("show")){
      controls.classList.remove("show");
    }else{
      showBlurControls();
    }
  }
});


/* CAPTURE */
document.querySelector(".capture").onclick=()=>{
  frozen=true;
  filtersDiv.style.display="none";
  controls.classList.remove("show");
  saveBtn.style.display="block";
  closeBtn.style.display="block";
  effectsBtn.style.display = "flex";

};

saveBtn.onclick = () => {
  if (recordedVideoURL) {
    // VIDEO SAVE
    const a = document.createElement("a");
    a.href = recordedVideoURL;
    a.download = "story-video.webm";
    a.click();
  } else {
    // PHOTO SAVE (existing)
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "story.png";
    a.click();
  }
};

closeBtn.onclick = () => {
  frozen = false;

  const preview = document.getElementById("previewVideo");
  preview.pause();
  preview.src = "";
  preview.style.display = "none";

  recordedVideoURL = null;

  filtersDiv.style.display = "flex";
  saveBtn.style.display = "none";
  closeBtn.style.display = "none";
  
};


draw();
</script>

</body>
</html>
