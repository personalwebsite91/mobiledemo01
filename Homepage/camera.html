<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  font-family:Poppins,system-ui;
  height:100vh;
  overflow:hidden;
  color:#fff;
}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

.camera{position:relative;width:100%;height:100%}
video,canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
video.mirror{transform:scaleX(-1)}

.top{
  position:absolute;
  top:12px;
  width:100%;
  text-align:center;
  font-weight:600;
  z-index:20;
}

/* FILTER SCROLLER */
.filters{
  position:absolute;
  bottom:90px;
  width:100%;
  display:flex;
  gap:26px;
  padding:0 50%;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  z-index:20;
}
.filter{
  scroll-snap-align:center;
  text-align:center;
  opacity:.4;
  transition:.3s;
}
.filter.active{
  opacity:1;
  transform:scale(1.2);
}

/* STAR */
.star{
  width:42px;
  height:42px;
  clip-path:polygon(
    50% 0%,61% 35%,98% 35%,68% 57%,
    79% 100%,50% 75%,21% 100%,32% 57%,
    2% 35%,39% 35%
  );
  transition: transform .35s ease;
  background:conic-gradient(#FF9933,#138808,#FF9933);
}
.filter.active .star{
  transform: rotate(180deg) scale(1.15);
}
@keyframes blink{50%{opacity:.3}}
#recordTimer{color:red;animation:blink 1s infinite}


/* CONTROLS */
.controls{
  position:absolute;
  bottom:150px;
  width:100%;
  padding:10px 16px;
  display:none;
  z-index:20;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
  border-radius:14px;
}
.controls.show{display:block}
.controls label{font-size:12px;opacity:.85}
.controls{
  transition: opacity .25s ease, transform .25s ease;
  transform: translateY(10px);
  opacity:0;
}
.controls.show{
  opacity:1;
  transform: translateY(0);
}


/* CAPTURE */
.capture{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:60px;
  height:60px;
  border-radius:50%;
  border:5px solid #fff;
  background:none;
  z-index:20;
}
.zoom-ring{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:80px;
  border-radius:50%;
  border:2px dashed rgba(164, 148, 148, 0.35);
  z-index:19;
  pointer-events:auto;
  touch-action:none;
}
.zoom-indicator{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.6);
  transform:rotate(0deg);
  transition:transform 0.05s linear;
}

/* FLIP CAMERA BUTTON */
.flip-btn{
  position:absolute;
  bottom:28px;
  right:24px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  cursor:pointer;
}

/* SAVE / CLOSE */
.action-btn{
  position:absolute;
  top:12px;
  padding:6px 14px;
  border-radius:20px;
  background:rgba(0,0,0,.6);
  font-size:13px;
  z-index:50;
  display:none;
}
#saveBtn{
  right:20px;
  bottom:84px;
  top:auto;
  left:auto;
  background-color: azure;
  font-weight:900 ;
  color: #0400ea;


}

#closeBtn{
  right:20px;
  bottom:50px;
  top:auto;
  background-color: azure;
  left:auto;
  font-weight:900 ;
   color: #ff0000;
}

.image-options{
  position:absolute;
  top:25px;
  left:14px;
  z-index:30;
  cursor:pointer;
}

.options-panel{
  display:none;
  margin-top:8px;
  padding:12px;
  width:160px;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(12px);
  border-radius:14px;
}

.image-options:hover .options-panel{
  display:block;
}

.options-panel label{
  font-size:12px;
  opacity:.8;
  display:block;
  margin-top:8px;
}
.zoom-label{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:11px;
  font-weight:600;
  opacity:0.85;
  pointer-events:none;
}
.tint-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:8px;
}

.tint-box{
  height:38px;
  border-radius:10px;
  border:1.5px solid rgba(255,255,255,.25);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  font-size:9px;
  padding-bottom:4px;
  cursor:pointer;
  transition:.2s;
  position:relative;
  overflow:hidden;
}

.tint-box::after{
  content:"";
  position:absolute;
  inset:0;
  background:var(--tint);
  mix-blend-mode:color;
}

.tint-box.active{
  border-color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.35);
}

.tint-box span{
  position:relative;
  z-index:2;
  opacity:.85;
}
.filter{
  scroll-snap-align:center;
  opacity:.2;
  transition:.3s;
  display:flex;
  justify-content:center;
}

.filter-inner{
  width:68px;               /* 🔑 fixed visual width */
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.filter-label{
  font-size:10px;
  margin-top:4px;
  white-space:nowrap;
  /* overflow:hidden; */
  text-overflow:ellipsis;
  max-width:100%;
  color: rgb(255, 255, 255);
}

</style>
</head>

function updateUIForFrozenState(isFrozen){
  document.getElementById("captureBtn").style.display = isFrozen ? "none" : "block";
  document.getElementById("flipBtn").style.display = isFrozen ? "none" : "flex";

/* CAMERA */
async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode}});
  video.srcObject = stream;
  video.classList.toggle("mirror", facingMode==="user");
}
startCamera();
function startRecording(){
  if(!stream || isRecording) return;

  recordedChunks = [];

  const canvasStream = canvas.captureStream(30);
  const audioTrack = stream.getAudioTracks()[0];
  if(audioTrack) canvasStream.addTrack(audioTrack);

  mediaRecorder = new MediaRecorder(canvasStream, { mimeType:"video/webm" });

  mediaRecorder.ondataavailable = e => {
    if(e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type:"video/webm" });
    recordedVideoURL = URL.createObjectURL(blob);

    const preview = document.getElementById("previewVideo");
    preview.src = recordedVideoURL;
    preview.style.display = "block";
    preview.play();

    frozen = true;
    updateUIForFrozenState(true);
  };

  mediaRecorder.start();
  isRecording = true;
  recordStartTime = Date.now();
  updateRecordTimer();
  recordTimerInterval = setInterval(updateRecordTimer, 1000);
}


function stopRecording(){
  if(!mediaRecorder || !isRecording) return;

  mediaRecorder.stop();
  isRecording = false;
  videoArmed = false;

  clearInterval(recordTimerInterval);
  document.getElementById("recordTimer").style.display = "none";
}

function updateRecordTimer(){
  const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
  const min = String(Math.floor(elapsed / 60)).padStart(2,"0");
  const sec = String(elapsed % 60).padStart(2,"0");
  document.getElementById("recordTimer").textContent = `● ${min}:${sec}`;
}

const captureBtn = document.querySelector(".capture");
captureBtn.addEventListener("click", () => {
  tapCount++;

  if (tapCount === 1) {
    tapTimeout = setTimeout(() => {
      // SINGLE TAP
      if (videoArmed) {
        toggleRecording();
      } else {
        frozen = true;
        updateUIForFrozenState(true);
      }
      tapCount = 0;
    }, 300);
  }

  if (tapCount === 2) {
    clearTimeout(tapTimeout);
    tapCount = 0;

    // DOUBLE TAP → ARM VIDEO MODE
    videoArmed = true;
    showVideoArmedUI();
  }
});

function showVideoArmedUI(){
  document.getElementById("recordTimer").style.display = "block";
  document.getElementById("recordTimer").textContent = "● Video Mode";
}
function toggleRecording(){
  if (!isRecording) {
    startRecording();
  } else {
    stopRecording();
  }
}

/* DRAW */
function drawVideo(){
  ctx.save();

  // Zoom logic
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.scale(zoomLevel, zoomLevel);

  if(facingMode==="user"){
    ctx.scale(-1,1);
  }

  ctx.drawImage(
    video,
    -canvas.width / 2,
    -canvas.height / 2,
    canvas.width,
    canvas.height
  );

  ctx.restore();
}

function gradeImage({
  exposure = 1,
  contrast = 1,
  saturation = 1,
  shadows = 0,
  highlights = 0,
  tint = null,
  blur = 0
}){

  // Combine filter blur + global blur
  const finalBlur = blur + imageOptions.blur;
  const finalSaturation = imageOptions.mono ? 0 : saturation;


  ctx.filter = `
    brightness(${exposure})
    contrast(${contrast})
    saturate(${finalSaturation})

    blur(${finalBlur}px)
  `;
  drawVideo();
  ctx.filter = "none";

  // Shadow lift / crush
  if(shadows !== 0){
    ctx.globalCompositeOperation = "overlay";
    ctx.fillStyle = shadows > 0
      ? `rgba(0,0,0,${shadows})`
      : `rgba(255,255,255,${-shadows})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation = "source-over";
  }

  // Highlight rolloff
  if(highlights !== 0){
    ctx.globalCompositeOperation = "screen";
    ctx.fillStyle = `rgba(255,255,255,${highlights})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation = "source-over";
  }

  // Color tint (split toning lite)
  if(tint){
    ctx.globalCompositeOperation = "color";
    ctx.fillStyle = tint;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation = "source-over";
  }
    // Global tint overlay
  if(imageOptions.tint){
    ctx.globalCompositeOperation = "color";
    ctx.fillStyle = imageOptions.tint;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation = "source-over";
  }

}


function applyFilter(name){
  switch(name){

    /* ===== CAMERA / EVERYDAY ===== */

    case "normal":
      gradeImage({
        exposure: 1.02,
        contrast: 1.05,
        saturation: 1.04,
        shadows: -0.04,
        highlights: 0.03
      });
      break;

    case "bright":
      gradeImage({
        exposure: 1.12,
        contrast: 1.06,
        saturation: 1.05,
        shadows: -0.06,
        highlights: 0.05
      });
      break;

    case "daylight":
      gradeImage({
        exposure: 1.08,
        contrast: 1.04,
        saturation: 1.12,
        shadows: -0.05,
        highlights: 0.06,
        tint: "rgba(255,240,210,0.07)"
      });
      break;

    case "indoor":
      gradeImage({
        exposure: 1.05,
        contrast: 1.04,
        saturation: 1.1,
        shadows: -0.06,
        highlights: 0.04,
        tint: "rgba(255,215,180,0.12)"
      });
      break;

    /* ===== PORTRAIT (SKIN SAFE) ===== */

    case "portrait":
      gradeImage({
        exposure: 1.04,
        contrast: 0.96,
        saturation: 1.06,
        shadows: -0.08,
        highlights: 0.05,
        tint: "rgba(255,220,200,0.09)"
      });
      break;

    /* ===== COLOR BALANCE ===== */

    case "warm":
      gradeImage({
        exposure: 1.03,
        contrast: 1.04,
        saturation: 1.12,
        shadows: -0.06,
        highlights: 0.05,
        tint: "rgba(255,195,150,0.14)"
      });
      break;

    case "cool": // TRUE cool grading
      gradeImage({
        exposure: 1.01,
        contrast: 1.08,
        saturation: 1.04,
        shadows: -0.06,
        highlights: 0.04,
        tint: "rgba(170,210,255,0.14)"
      });
      break;

    /* ===== FILM / ANALOG ===== */

    case "film":
      gradeImage({
        exposure: 1.03,
        contrast: 0.88,
        saturation: 0.94,
        shadows: -0.18,
        highlights: 0.1,
        tint: "rgba(200,160,120,0.16)"
      });
      break;

    case "kodak":
      gradeImage({
        exposure: 1.05,
        contrast: 1.14,
        saturation: 1.18,
        shadows: -0.08,
        highlights: 0.06,
        tint: "rgba(215,160,90,0.14)"
      });
      break;

    case "fuji":
      gradeImage({
        exposure: 1.02,
        contrast: 1.1,
        saturation: 1.08,
        shadows: -0.04,
        highlights: 0.04,
        tint: "rgba(200,225,255,0.08)"
      });
      break;

    case "matte":
      gradeImage({
        exposure: 1.06,
        contrast: 0.86,
        saturation: 0.94,
        shadows: -0.22,
        highlights: 0.06
      });
      break;

    /* ===== CINEMATIC / EDITORIAL ===== */

    case "cinematic":
      gradeImage({
        exposure: 0.96,
        contrast: 1.35,
        saturation: 1.06,
        shadows: 0.18,
        highlights: 0.06,
        tint: "rgba(20,50,80,0.18)"
      });
      break;

    case "fashion":
      gradeImage({
        exposure: 1.01,
        contrast: 1.32,
        saturation: 1.05,
        shadows: 0.08,
        highlights: 0.05
      });
      break;

    case "doc":

const zoomRing = document.getElementById("zoomRing");
const zoomIndicator = document.getElementById("zoomIndicator");

function getAngle(e){
  const rect = zoomRing.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  const x = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - cy;

  return Math.atan2(y, x) * 180 / Math.PI;
}

const zoomLabel = document.getElementById("zoomLabel");

function updateZoom(delta){
  zoomLevel += delta * 0.005;
  zoomLevel = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoomLevel));

  zoomAngle += delta;
  zoomIndicator.style.transform = `rotate(${zoomAngle}deg)`;

  // Update visible zoom value
  zoomLabel.textContent = zoomLevel.toFixed(1) + "×";
}


["mousedown","touchstart"].forEach(ev=>{
  zoomRing.addEventListener(ev,e=>{
    lastAngle = getAngle(e);
  });
});

["mousemove","touchmove"].forEach(ev=>{
  zoomRing.addEventListener(ev,e=>{
    if(lastAngle === null) return;

    const angle = getAngle(e);
    let delta = angle - lastAngle;

    // 🔥 FIX: normalize angle wrap (-180 ↔ 180)
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    updateZoom(delta);
    lastAngle = angle;
  });
});


["mouseup","mouseleave","touchend"].forEach(ev=>{
  zoomRing.addEventListener(ev,()=>{
    lastAngle = null;
  });
});


draw();
