<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Camera</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  font-family:Poppins,system-ui;
  height:100vh;
  overflow:hidden;
  color:#fff;
}

.camera{position:relative;width:100%;height:100%}
video,canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
video.mirror{transform:scaleX(-1)}

.top{
  position:absolute;
  top:12px;
  width:100%;
  text-align:center;
  font-weight:600;
  z-index:20;
}

/* FILTER SCROLLER */
.filters{
  position:absolute;
  bottom:90px;
  width:100%;
  display:flex;
  gap:26px;
  padding:0 50%;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  z-index:20;
}
.filter{
  scroll-snap-align:center;
  text-align:center;
  opacity:.4;
  transition:.3s;
}
.filter.active{
  opacity:1;
  transform:scale(1.2);
}

/* STAR ROTATION */
.star{
  width:42px;
  height:42px;
  clip-path:polygon(
    50% 0%,61% 35%,98% 35%,68% 57%,
    79% 100%,50% 75%,21% 100%,32% 57%,
    2% 35%,39% 35%
  );
  background:conic-gradient(#FF9933,#138808,#FF9933);
  transition:transform .4s;
}
.filter.active .star{
  transform:rotate(180deg) scale(1.15);
}

/* CONTROLS */
.controls{
  position:absolute;
  bottom:150px;
  width:100%;
  padding:10px 16px;
  display:none;
  z-index:20;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
  border-radius:14px;
}
.controls.show{display:block}

/* CAPTURE */
.capture{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:72px;
  height:72px;
  border-radius:50%;
  border:5px solid #fff;
  background:none;
  z-index:20;
}

/* FLIP CAMERA */
.flip-btn{
  position:absolute;
  bottom:28px;
  right:24px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:20;
  cursor:pointer;
}

/* RIGHT TOOLBAR */
.toolbar{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:25;
}
.tool{
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:12px;
}

/* SAVE / CLOSE */
.action-btn{
  position:absolute;
  top:12px;
  padding:6px 14px;
  border-radius:20px;
  background:rgba(0,0,0,.6);
  display:none;
}
#saveBtn{left:12px}
#closeBtn{left:12px;top:45px}

#overlayInput{display:none}
</style>
</head>

<body>

<div class="camera" id="camera">
  <div class="top">Shakticlick</div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- BLUR CONTROLS -->
  <div class="controls" id="blurControls">
    <label>Blur Intensity</label>
    <input type="range" min="0" max="8" value="3" id="blurIntensity">
  </div>

  <!-- FILTERS -->
  <div class="filters" id="filters"></div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="tool" id="timerBtn">⏱</div>
    <div class="tool" id="collageBtn">🧩</div>
    <div class="tool" id="overlayBtn">🖼</div>
  </div>

  <button class="capture"></button>
  <div class="flip-btn" id="flipBtn">↺</div>

  <div class="action-btn" id="saveBtn">Save</div>
  <div class="action-btn" id="closeBtn">✕</div>

  <input type="file" id="overlayInput" accept="image/*">
</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const camera=document.getElementById("camera");
const controls=document.getElementById("blurControls");
const blurIntensityInput=document.getElementById("blurIntensity");
const filtersDiv=document.getElementById("filters");
const flipBtn=document.getElementById("flipBtn");
const timerBtn=document.getElementById("timerBtn");
const collageBtn=document.getElementById("collageBtn");
const overlayBtn=document.getElementById("overlayBtn");
const overlayInput=document.getElementById("overlayInput");

let filter="normal";
let blurIntensity=3;
let facingMode="user";
let stream=null;
let hideTimer=null;
let overlayImg=null;

/* CAMERA */
async function startCamera(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode}});
  video.srcObject=stream;
  video.classList.toggle("mirror",facingMode==="user");
}
startCamera();

video.onloadedmetadata=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
};

/* FILTER LIST */
[
 "normal","blur","focus","warm","cool","glow","vintage",
 "dramatic","mono","gangster","soft","cinematic"
].forEach(f=>{
  const d=document.createElement("div");
  d.className="filter";
  d.dataset.f=f;
  d.innerHTML=`<div class="star"></div><div style="font-size:11px">${f}</div>`;
  filtersDiv.appendChild(d);
});

/* SCROLL DETECT */
filtersDiv.addEventListener("scroll",()=>{
  document.querySelectorAll(".filter").forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.left<innerWidth/2 && r.right>innerWidth/2){
      document.querySelectorAll(".filter").forEach(e=>e.classList.remove("active"));
      el.classList.add("active");
      filter=el.dataset.f;

      if(filter==="blur"){
        showControls();
      } else {
        controls.classList.remove("show");
      }
    }
  });
});

/* BLUR CONTROL AUTO HIDE */
function showControls(){
  controls.classList.add("show");
  clearTimeout(hideTimer);
  hideTimer=setTimeout(()=>controls.classList.remove("show"),3000);
}

camera.addEventListener("click",()=>{
  if(filter==="blur"){
    if(controls.classList.contains("show")){
      controls.classList.remove("show");
    }else{
      showControls();
    }
  }
});

/* FLIP */
flipBtn.onclick=()=>{
  facingMode=facingMode==="user"?"environment":"user";
  startCamera();
};

/* OVERLAY */
overlayBtn.onclick=()=>overlayInput.click();
overlayInput.onchange=e=>{
  const img=new Image();
  img.onload=()=>overlayImg=img;
  img.src=URL.createObjectURL(e.target.files[0]);
};

/* DRAW */
function drawVideo(){
  ctx.save();
  if(facingMode==="user"){
    ctx.translate(canvas.width,0);
    ctx.scale(-1,1);
  }
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();
}

function draw(){
  drawVideo();

  if(filter==="blur"){
    ctx.filter=`blur(${blurIntensity}px)`;
    drawVideo();
    ctx.filter="none";
  }

  if(filter==="warm") ctx.filter="contrast(1.1) saturate(1.2) sepia(.25)";
  if(filter==="cool") ctx.filter="saturate(1.1) hue-rotate(180deg)";
  if(filter==="glow") ctx.filter="brightness(1.1) blur(2px)";
  if(filter==="vintage") ctx.filter="sepia(.4) contrast(1.1)";
  if(filter==="dramatic") ctx.filter="contrast(1.5) saturate(1.3)";
  if(filter==="mono") ctx.filter="grayscale(1)";
  if(filter==="gangster") ctx.filter="grayscale(.9) contrast(1.6)";
  if(filter==="soft") ctx.filter="brightness(1.05) blur(1px)";
  if(filter==="cinematic") ctx.filter="contrast(1.2) saturate(1.15)";

  if(!["normal","blur","focus"].includes(filter)){
    drawVideo();
    ctx.filter="none";
  }

  if(overlayImg){
    ctx.drawImage(overlayImg,0,0,canvas.width,canvas.height);
  }

  requestAnimationFrame(draw);
}
draw();

blurIntensityInput.oninput=e=>blurIntensity=Number(e.target.value);
</script>

</body>
</html>
