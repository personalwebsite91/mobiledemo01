<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Camera</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#000;
  font-family:Poppins,system-ui;
  height:100vh;
  overflow:hidden;
  color:#fff;
}
*::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

.camera{position:relative;width:100%;height:100%}
video,canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
video.mirror{transform:scaleX(-1)}

.top{
  position:absolute;
  top:12px;
  width:100%;
  text-align:center;
  font-weight:600;
  z-index:20;
}

/* FILTER SCROLLER */
.filters{
  position:absolute;
  bottom:90px;
  width:100%;
  display:flex;
  gap:26px;
  padding:0 50%;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  z-index:20;
}
.filter{
  scroll-snap-align:center;
  text-align:center;
  opacity:.4;
  transition:.3s;
}
.filter.active{
  opacity:1;
  transform:scale(1.2);
}

/* TRICOLOR SWIRL STAR */
.star{
  width:42px;
  height:42px;
  clip-path:polygon(
    50% 0%,61% 35%,98% 35%,68% 57%,
    79% 100%,50% 75%,21% 100%,32% 57%,
    2% 35%,39% 35%
  );
  background:conic-gradient(#FF9933,#138808,#FF9933);
  transition:.4s;
}
.filter.active .star{
  transform:rotate(180deg) scale(1.15);
}

/* CONTROLS */
.controls{
  position:absolute;
  bottom:150px;
  width:100%;
  padding:10px 16px;
  display:none;
  z-index:20;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(8px);
  border-radius:14px;
}
.controls.show{display:block}
.controls label{font-size:12px;opacity:.85}
.controls input[type="range"]{
  width:100%;
  height:4px;
  margin:6px 0;
}
.controls input[type="color"]{
  width:100%;
  height:32px;
  border:none;
  border-radius:8px;
  background:linear-gradient(90deg,#FF9933,#fff,#138808);
}

/* CAPTURE */
.capture{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:72px;
  height:72px;
  border-radius:50%;
  border:5px solid #fff;
  background:none;
  z-index:20;
}

/* SAVE / CLOSE */
.action-btn{
  position:absolute;
  top:12px;
  padding:6px 14px;
  border-radius:20px;
  background:rgba(0,0,0,.6);
  font-size:13px;
  z-index:30;
  display:none;
}
#saveBtn{left:12px}
#closeBtn{left:12px;top:45px}
</style>
</head>

<body>

<div class="camera" id="camera">
  <div class="top">Shakticlick</div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <!-- BLUR CONTROLS -->
  <div class="controls" id="blurControls">
    <label>Blur Intensity</label>
    <input type="range" min="0" max="8" value="3" id="blurIntensity">
    <label>Blur Tint</label>
    <input type="color" id="blurTint">
  </div>

  <!-- FILTERS -->
  <div class="filters" id="filters"></div>

  <button class="capture"></button>

  <div class="action-btn" id="saveBtn">Save</div>
  <div class="action-btn" id="closeBtn">✕</div>
</div>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const controls=document.getElementById("blurControls");
const filtersDiv=document.getElementById("filters");
const saveBtn=document.getElementById("saveBtn");
const closeBtn=document.getElementById("closeBtn");
const blurIntensityInput = document.getElementById("blurIntensity");
const blurTintInput = document.getElementById("blurTint");


let mirror=true;
let filter="normal";
let blurIntensity=3;
let blurTint=null;
let focusPoints=[];
let frozen=false;

/* CAMERA */
navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(s=>{
  video.srcObject=s;
  if(mirror)video.classList.add("mirror");
});

video.onloadedmetadata=()=>{
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  draw();
};

/* FILTER LIST */
const filterList=[
  "normal","blur","focus",
  "warm","cool","glow","vintage","dramatic","mono"
];

filterList.forEach(f=>{
  const d=document.createElement("div");
  d.className="filter";
  d.dataset.f=f;
  d.innerHTML=`<div class="star"></div><div style="font-size:11px">${f}</div>`;
  filtersDiv.appendChild(d);
});

/* SCROLL DETECT */
filtersDiv.addEventListener("scroll",()=>{
  document.querySelectorAll(".filter").forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.left<innerWidth/2 && r.right>innerWidth/2){
      document.querySelectorAll(".filter").forEach(e=>e.classList.remove("active"));
      el.classList.add("active");
      filter=el.dataset.f;
      controls.classList.toggle("show",filter==="blur");
    }
  });
});

/* TAP TO TOGGLE BLUR */
document.getElementById("camera").addEventListener("click",()=>{
  if(filter==="blur" && !frozen){
    controls.classList.toggle("show");
  }
});

/* FOCUS */
canvas.addEventListener("click",e=>{
  if(filter==="focus")focusPoints.push({x:e.offsetX,y:e.offsetY});
});

/* DRAW */
function drawVideo(){
  ctx.save();
  if(mirror){
    ctx.translate(canvas.width,0);
    ctx.scale(-1,1);
  }
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();
}

function draw(){
  if(!frozen){
    drawVideo();

    if(filter==="blur"){
      ctx.filter=`blur(${blurIntensity}px)`;
      drawVideo();
      ctx.filter="none";
      if(blurTint){
        ctx.fillStyle=blurTint+"33";
        ctx.fillRect(0,0,canvas.width,canvas.height);
      }
    }

    if(filter==="focus" && focusPoints.length>2){
      ctx.filter="blur(14px)";
      drawVideo();
      ctx.filter="none";
      ctx.save();
      ctx.beginPath();
      focusPoints.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
      ctx.closePath();
      ctx.clip();
      drawVideo();
      ctx.restore();
    }

    if(filter==="warm")ctx.filter="contrast(1.1) saturate(1.2) sepia(.2)";
    if(filter==="cool")ctx.filter="saturate(1.1) hue-rotate(190deg)";
    if(filter==="glow")ctx.filter="brightness(1.1) blur(2px)";
    if(filter==="vintage")ctx.filter="sepia(.4) contrast(1.1)";
    if(filter==="dramatic")ctx.filter="contrast(1.4) saturate(1.2)";
    if(filter==="mono")ctx.filter="grayscale(1)";

    if(!["normal","blur","focus"].includes(filter)){
      drawVideo();
      ctx.filter="none";
    }
  }
  requestAnimationFrame(draw);
}
function renderFinalFrame(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawVideo();

  if(filter==="blur"){
    ctx.filter=`blur(${blurIntensity}px)`;
    drawVideo();
    ctx.filter="none";
    if(blurTint){
      ctx.fillStyle=blurTint+"33";
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }
  }

  if(filter==="focus" && focusPoints.length>2){
    ctx.filter="blur(14px)";
    drawVideo();
    ctx.filter="none";
    ctx.save();
    ctx.beginPath();
    focusPoints.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.closePath();
    ctx.clip();
    drawVideo();
    ctx.restore();
  }

  if(filter==="warm") ctx.filter="contrast(1.1) saturate(1.2) sepia(.2)";
  if(filter==="cool") ctx.filter="saturate(1.1) hue-rotate(190deg)";
  if(filter==="glow") ctx.filter="brightness(1.1) blur(2px)";
  if(filter==="vintage") ctx.filter="sepia(.4) contrast(1.1)";
  if(filter==="dramatic") ctx.filter="contrast(1.4) saturate(1.2)";
  if(filter==="mono") ctx.filter="grayscale(1)";

  if(!["normal","blur","focus"].includes(filter)){
    drawVideo();
    ctx.filter="none";
  }
}


/* CONTROLS */

blurIntensityInput.oninput = e => {
  blurIntensity = Number(e.target.value);
};

blurTintInput.oninput = e => {
  blurTint = e.target.value;
};


/* CAPTURE FLOW */
document.querySelector(".capture").onclick=()=>{
  renderFinalFrame();   // 🔥 FORCE FINAL DRAW
  frozen=true;

  filtersDiv.style.display="none";
  controls.classList.remove("show");
  saveBtn.style.display="block";
  closeBtn.style.display="block";
};


saveBtn.onclick=()=>{
  const link=document.createElement("a");
  link.href=canvas.toDataURL("image/png");
  link.download="story.png";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
};

closeBtn.onclick=()=>{
  frozen=false;
  filtersDiv.style.display="flex";
  saveBtn.style.display="none";
  closeBtn.style.display="none";
};

draw();
</script>

</body>
</html>
